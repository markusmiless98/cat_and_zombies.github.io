<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="initial-scale=1.0">
    <title>Cat & Zombies</title>
    <link rel="stylesheet" href="cat_zomb_layout.css">
</head>

<body>
    <h1>Cat & Zombies</h1>
    <div class="img_container">
        <img id="location" class="location_pic" src="pics/pic_cat.png">
    </div>
    <div class="input_container">
        <button id="button_up">
            North
        </button>
        <button id="button_left">
            West
        </button>
        <button id="button_right">
            East
        </button>
        <button id="button_down">
            South
        </button>
        <div id="position_txt">
            here is position: 2,2
        </div>
        <div id="info_text">
            Safe Location!
        </div>
    </div>
    <div class="container" id="layout">
    </div>
    <img id="pokemonSprite"/>
    <div id="text_temp"></div>
</body>
<script>
    var positions = []
    var cat_positions = []
    var zomb_positions = []
    const pokenames = [
        "delcatty",
        "litten",
        "purrloin",
        "skitty",
        "meowth",
        "eevee",
        "sprigatito"
    ]
    const imgElement = document.getElementById("location");
    var num_cats = 0;
    var num_zombies = 0;
    let game_won = false;
    let game_lost = false;

    function getRandomInt(min, max) {
        const minCeiled = Math.ceil(min);
        const maxFloored = Math.floor(max);
        return Math.floor(Math.random() * (maxFloored - minCeiled) + minCeiled); // The maximum is exclusive and the minimum is inclusive
    }

    function UpdateIfCat(is_cat_there)
    {
        if (is_cat_there)
        {
            fetchPokeCat();
        }
        else
        {
            imgElement.src="pics/no_cat.png"
        }
    }
    async function fetchPokeCat(){
        try{
            let pokemonName = pokenames[getRandomInt(0,pokenames.length)];
            const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonName}`);

            if(!response.ok){
                throw new Error("Could not fetch resource");
            }

            const data = await response.json();
            const pokemonSprite = data.sprites.front_default;
            const imgElement = document.getElementById("location");

            imgElement.src = pokemonSprite;
        }
        catch(error){
            console.error(error);
        }
    }
    UpdateIfCat(false);

    
</script>
<script src="cat_zomb_layout.js"></script>
<script src="cat_zomb_appearance.js"></script>
</html>
